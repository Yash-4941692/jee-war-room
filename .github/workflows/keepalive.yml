name: keep-alive

# Pings the production function every 10 minutes so a visitor is never the
# person who pays for a cold serverless boot / idle database wake-up. The
# weekly db-backup workflow's commit is enough to keep the repo "active", so
# this workflow never commits (no deploy loops).
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 min
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (waits through a cold wake if needed)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL repository variable not set yet — skipping"; exit 0; fi
          echo "Pinging $APP_URL/healthz"
          curl -fsS --max-time 120 "$APP_URL/healthz?detail=1"
          echo " -> healthy"
