name: keep-alive

# Pings the cloud deployment every 20 minutes so the free Koyeb instance
# never scales to zero, and keeps the database connection active so the free
# Turso database is never treated as dormant.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL repository variable not set yet — skipping"; exit 0; fi
          echo "Pinging $APP_URL/healthz"
          curl -fsS --max-time 60 "$APP_URL/healthz"
          echo " -> healthy"

  # GitHub disables scheduled workflows after ~60 days without repository
  # activity. This weekly empty commit keeps the repository "active" forever.
  touch:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Weekly activity commit
        run: |
          echo "$(date -u +%FT%TZ)" >> .keepalive-log
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive-log
          git commit -m "chore: scheduled keepalive touch" || echo "nothing to commit"
          git push || true
