name: keep-alive

# Keeps the serverless function warm (faster first response) and the Turso
# database active. Runs every 10 minutes (~4,400 pings/month, far inside the
# 1M free function invocations and Actions allowances).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL not set yet — skipping"; exit 0; fi
          echo "Pinging $APP_URL/healthz"
          curl -fsS --max-time 60 "$APP_URL/healthz" && echo " -> healthy"

  touch:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Weekly activity commit (keeps scheduled workflows enabled)
        run: |
          WEEK=$(date -u +%G-W%V)
          if [ "$(date -u +%u)" = "1" ]; then
            echo "$(date -u +%FT%TZ) week $WEEK" >> .keepalive-log
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .keepalive-log
            git commit -m "chore: keepalive touch $WEEK" || echo "nothing to commit"
            git push || true
          fi
