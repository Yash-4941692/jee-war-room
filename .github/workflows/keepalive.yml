name: keep-alive

# Pings the production function every 10 minutes so a visitor is never the
# person who pays for a cold serverless boot / idle database wake-up. The
# weekly db-backup workflow's commit is enough to keep the repo "active", so
# this workflow never commits (no deploy loops).
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 min
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (retry through a cold wake if needed)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL repository variable not set yet — skipping"; exit 0; fi
          echo "Warming $APP_URL/healthz (retries through a cold database wake)"
          for i in 1 2 3 4 5 6; do
            out=$(curl -fsS --max-time 30 "$APP_URL/healthz?detail=1" 2>&1) && { echo "$out"; echo " -> healthy"; exit 0; }
            echo "attempt $i not ready yet, retrying in 10s..."; sleep 10
          done
          echo "keepalive gave up after 6 attempts"; exit 1
